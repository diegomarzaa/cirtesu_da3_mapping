#     # Camera image topic to subscribe to while recording
#     image_topic: '/camera/image_raw'

#     # Where sessions are saved. Each session creates a timestamped subfolder:
#     #   da3_sessions/session_YYYYMMDD_HHMMSS/
#     #     frames/      ← PNGs saved by the node
#     #     pcd/         ← DA3-Streaming output (combined_pcd.ply, chunk plys)
#     #     camera_poses.txt
#     #     intrinsic.txt
#     session_base_dir: '/home/diego/Cirtesu/media/da3_sessions'

#     # DA3-Streaming invocation (paths inside the container)
#     da3_python: '/opt/venvs/da3/bin/python3'
